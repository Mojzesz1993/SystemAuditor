# ==============================================================================
# SystemAuditor Enterprise — Katalog Reguł Bezpieczeństwa (CIS Benchmark L1/L2)
# ==============================================================================
# Zasada Zero-Trust:
# 1. Reguły są w 100% DEKLARATYWNE — brak wykonywania skryptów powłoki (No RCE).
# 2. Cały katalog jest podpisywany kryptograficznie kluczem prywatnym Ed25519
#    serwera centralnego (lub Offline Master Key). Agent weryfikuje podpis przed
#    uruchomieniem kolektorów.
# ==============================================================================

policy_metadata:
  policy_id: "pol-cis-enterprise-2026-10"
  version: "2026.10.4"
  name: "Enterprise CIS Benchmark L1/L2 + NIS2 & ISO 27001:2022 Baseline (Windows & Linux - 42 Rules)"
  author: "Principal Security Architecture Team"
  published_at: "2026-10-20T11:00:00Z"
  signature_ed25519: "auto-signed-by-pki-engine"

rules:
  # ============================================================================
  # WINDOWS CIS BENCHMARK & ATTACK SURFACE RULES (22 KOMPLETNE REGUŁY)
  # ============================================================================

  - rule_id: "WIN-CIS-18.3.1"
    os_family: "windows"
    category: "Network Security"
    title: "Ensure SMBv1 Server protocol is disabled"
    benchmark_ref: "CIS Microsoft Windows Server 2022 Benchmark v3.0.0 - 18.3.1"
    mitre_attack: ["T1210", "T1021.002"]
    compliance_frameworks:
      iso27001: "A.8.20 (Bezpieczeństwo sieci)"
      nis2: "Art. 21 ust. 2 lit. e (Bezpieczeństwo sieci i systemów)"
      ksc: "Zał. 1 pkt 14 (Ochrona usług sieciowych)"
    risk_severity: "CRITICAL"
    cvss_base_score: 9.8
    description: >
      Protokół SMBv1 jest przestarzały i podatny na krytyczne ataki zdalnego wykonania
      kodu (np. EternalBlue / WannaCry / NotPetya). Musi być bezwzględnie wyłączony.
    collector:
      type: "windows_registry"
      hive: "HKEY_LOCAL_MACHINE"
      key_path: 'SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      value_name: "SMB1"
    expected_state:
      operator: "in_set"
      allowed_values: [0, null]
      expected_reg_type: "REG_DWORD"
    remediation: >
      Uruchom PowerShell jako Administrator:
      Set-SmbServerConfiguration -EnableSMB1Protocol $false -Force
      Lub ustaw klucz HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters\SMB1 (DWORD) = 0.

  - rule_id: "WIN-CIS-2.3.17.1"
    os_family: "windows"
    category: "Privilege Escalation"
    title: "Ensure 'User Account Control: Run all administrators in Admin Approval Mode' is Enabled"
    benchmark_ref: "CIS Microsoft Windows 11 Enterprise Benchmark v3.0.0 - 2.3.17.1"
    mitre_attack: ["T1548.002"]
    compliance_frameworks:
      iso27001: "A.8.2 (Prawa dostępu uprzywilejowanego)"
      nis2: "Art. 21 ust. 2 lit. i (Kontrola dostępu i zarządzanie zasobami)"
      ksc: "Zał. 1 pkt 7 (Zarządzanie uprawnieniami administracyjnymi)"
    risk_severity: "HIGH"
    cvss_base_score: 7.8
    description: >
      Kontrola konta użytkownika (UAC / EnableLUA) wymusza zatwierdzanie operacji
      wymagających podwyższonych uprawnień (split-token dla administratorów).
    collector:
      type: "windows_registry"
      hive: "HKEY_LOCAL_MACHINE"
      key_path: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      value_name: "EnableLUA"
    expected_state:
      operator: "equals"
      value: 1
      expected_reg_type: "REG_DWORD"
    remediation: >
      Ustaw wartość rejestru HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableLUA = 1
      i uruchom ponownie system.

  - rule_id: "WIN-CIS-1.1.1"
    os_family: "windows"
    category: "Password & Account Policies"
    title: "Ensure 'Minimum password length' is set to 14 or more characters"
    benchmark_ref: "CIS Microsoft Windows 11 Enterprise Benchmark v3.0.0 - 1.1.1"
    mitre_attack: ["T1110.001", "T1110.002"]
    compliance_frameworks:
      iso27001: "A.5.17 (Informacje uwierzytelniające)"
      nis2: "Art. 21 ust. 2 lit. j (Uwierzytelnianie i higiena poświadczeń)"
      ksc: "Zał. 1 pkt 8 (Polityka haseł i uwierzytelniania)"
    risk_severity: "HIGH"
    cvss_base_score: 7.5
    description: >
      Krótkie hasła są podatne na łamanie metodą brute-force z użyciem akceleracji GPU
      w przypadku przejęcia skrótów NTLM.
    collector:
      type: "windows_security_policy"
      section: "System Access"
      parameter: "MinimumPasswordLength"
    expected_state:
      operator: "greater_than_or_equal"
      value: 14
      unit: "characters"
    remediation: >
      W GPO: Computer Configuration -> Policies -> Windows Settings -> Security Settings ->
      Account Policies -> Password Policy -> Minimum password length ustaw na minimum 14 znaków
      (lub wykonaj: net accounts /minpwlen:14).

  - rule_id: "WIN-CIS-9.1.1"
    os_family: "windows"
    category: "Host Firewall & Endpoint Protection"
    title: "Ensure 'Windows Defender Firewall: Domain/Standard Profile: Firewall state' is set to 'On'"
    benchmark_ref: "CIS Microsoft Windows Server 2022 Benchmark v3.0.0 - 9.1.1"
    mitre_attack: ["T1562.004"]
    compliance_frameworks:
      iso27001: "A.8.21 (Bezpieczeństwo usług sieciowych)"
      nis2: "Art. 21 ust. 2 lit. e (Segmentacja i ochrona brzegu hosta)"
      ksc: "Zał. 1 pkt 15 (Filtrowanie ruchu sieciowego)"
    risk_severity: "HIGH"
    cvss_base_score: 8.1
    description: >
      Zapora systemowa Windows Defender Firewall filtruje ruch przychodzący i wychodzący,
      ograniczając ruch boczny (Lateral Movement) wewnątrz sieci korporacyjnej.
    collector:
      type: "windows_registry"
      hive: "HKEY_LOCAL_MACHINE"
      key_path: 'SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\StandardProfile'
      value_name: "EnableFirewall"
    expected_state:
      operator: "equals"
      value: 1
      expected_reg_type: "REG_DWORD"
    remediation: >
      Włącz zaporę systemową poleceniem:
      Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True

  - rule_id: "WIN-CIS-18.4.2"
    os_family: "windows"
    category: "Credential Protection"
    title: "Ensure 'WDigest Authentication' is disabled (UseLogonCredential = 0)"
    benchmark_ref: "CIS Microsoft Windows 11 Enterprise Benchmark v3.0.0 - 18.4.2"
    mitre_attack: ["T1003.001"]
    compliance_frameworks:
      iso27001: "A.8.9 (Zarządzanie konfiguracją ochronną)"
      nis2: "Art. 21 ust. 2 lit. g (Podstawowe praktyki cyberhigieny)"
      ksc: "Zał. 1 pkt 9 (Ochrona poświadczeń w pamięci operacyjnej)"
    risk_severity: "CRITICAL"
    cvss_base_score: 9.1
    description: >
      Gdy protokół WDigest ma włączoną opcję UseLogonCredential=1, proces LSASS przechowuje
      hasła użytkowników w pamięci RAM w postaci jawnego tekstu (cleartext), co umożliwia
      natychmiastową kradzież poświadczeń narzędziami typu Mimikatz.
    collector:
      type: "windows_registry"
      hive: "HKEY_LOCAL_MACHINE"
      key_path: 'SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest'
      value_name: "UseLogonCredential"
    expected_state:
      operator: "in_set"
      allowed_values: [0, null]
      expected_reg_type: "REG_DWORD"
    remediation: >
      Ustaw wartość rejestru HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest\UseLogonCredential = 0.

  - rule_id: "WIN-CIS-2.3.11.7"
    os_family: "windows"
    category: "Credential Protection"
    title: "Ensure 'Network security: LAN Manager authentication level' is set to 'Send NTLMv2 response only. Refuse LM & NTLM'"
    benchmark_ref: "CIS Microsoft Windows Server 2022 Benchmark v3.0.0 - 2.3.11.7"
    mitre_attack: ["T1557.001", "T1110"]
    compliance_frameworks:
      iso27001: "A.8.24 (Stosowanie kryptografii)"
      nis2: "Art. 21 ust. 2 lit. h (Polityki stosowania kryptografii)"
      ksc: "Zał. 1 pkt 12 (Kryptograficzna ochrona uwierzytelniania)"
    risk_severity: "HIGH"
    cvss_base_score: 8.2
    description: >
      Starsze protokoły LM oraz NTLMv1 wykorzystują słabą kryptografię DES/MD4 i mogą zostać
      złamane w kilka sekund. Poziom 5 wymusza wyłącznie NTLMv2 oraz odrzuca LM/NTLMv1.
    collector:
      type: "windows_registry"
      hive: "HKEY_LOCAL_MACHINE"
      key_path: 'SYSTEM\CurrentControlSet\Control\Lsa'
      value_name: "LmCompatibilityLevel"
    expected_state:
      operator: "equals"
      value: 5
      expected_reg_type: "REG_DWORD"
    remediation: >
      Ustaw klucz HKLM\SYSTEM\CurrentControlSet\Control\Lsa\LmCompatibilityLevel (DWORD) = 5.

  - rule_id: "WIN-CIS-18.9.47.1"
    os_family: "windows"
    category: "Credential Protection"
    title: "Ensure LSASS runs as a Protected Process Light (RunAsPPL = 1 or 2)"
    benchmark_ref: "CIS Microsoft Windows 11 Enterprise Benchmark v3.0.0 - 18.9.47.1"
    mitre_attack: ["T1003.001"]
    compliance_frameworks:
      iso27001: "A.8.7 (Ochrona przed złośliwym oprogramowaniem i kradzieżą pamięci)"
      nis2: "Art. 21 ust. 2 lit. e (Bezpieczeństwo punktów końcowych)"
      ksc: "Zał. 1 pkt 9 (Izolacja procesów bezpieczeństwa LSASS)"
    risk_severity: "HIGH"
    cvss_base_score: 8.6
    description: >
      Uruchomienie procesu LSASS w trybie Protected Process Light (RunAsPPL) uniemożliwia
      niechronionym procesom (nawet z uprawnieniami Administratora) odczyt pamięci lsass.exe.
    collector:
      type: "windows_registry"
      hive: "HKEY_LOCAL_MACHINE"
      key_path: 'SYSTEM\CurrentControlSet\Control\Lsa'
      value_name: "RunAsPPL"
    expected_state:
      operator: "in_set"
      allowed_values: [1, 2]
      expected_reg_type: "REG_DWORD"
    remediation: >
      Ustaw wartość rejestru HKLM\SYSTEM\CurrentControlSet\Control\Lsa\RunAsPPL (DWORD) = 1.

  - rule_id: "WIN-CIS-18.10.57.1"
    os_family: "windows"
    category: "Audit & Logging"
    title: "Ensure 'Turn on PowerShell Script Block Logging' is set to 'Enabled'"
    benchmark_ref: "CIS Microsoft Windows 11 Enterprise Benchmark v3.0.0 - 18.10.57.1"
    mitre_attack: ["T1059.001"]
    compliance_frameworks:
      iso27001: "A.8.15 (Rejestrowanie zdarzeń / Logging)"
      nis2: "Art. 21 ust. 2 lit. b (Wykrywanie i obsługa incydentów)"
      ksc: "Zał. 1 pkt 18 (Monitorowanie i rejestrowanie aktywności skryptowej)"
    risk_severity: "MEDIUM"
    cvss_base_score: 6.5
    description: >
      Logowanie bloków skryptów PowerShell (Event ID 4104) zapisuje pełną, zdekodowaną treść
      wykonywanych poleceń PowerShell, co jest kluczowe do wykrywania ataków bezplikowych.
    collector:
      type: "windows_registry"
      hive: "HKEY_LOCAL_MACHINE"
      key_path: 'SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging'
      value_name: "EnableScriptBlockLogging"
    expected_state:
      operator: "equals"
      value: 1
      expected_reg_type: "REG_DWORD"
    remediation: >
      Włącz GPO: Administrative Templates -> Windows Components -> Windows PowerShell ->
      Turn on PowerShell Script Block Logging (EnableScriptBlockLogging = 1).

  - rule_id: "WIN-CIS-2.3.1.2"
    os_family: "windows"
    category: "Password & Account Policies"
    title: "Ensure 'Accounts: Guest account status' is set to 'Disabled'"
    benchmark_ref: "CIS Microsoft Windows 11 Enterprise Benchmark v3.0.0 - 2.3.1.2"
    mitre_attack: ["T1078.001"]
    compliance_frameworks:
      iso27001: "A.5.16 (Zarządzanie tożsamością i kontami domyślnymi)"
      nis2: "Art. 21 ust. 2 lit. i (Kontrola dostępu)"
      ksc: "Zał. 1 pkt 6 (Blokada kont anonimowych i gościnnych)"
    risk_severity: "HIGH"
    cvss_base_score: 7.4
    description: >
      Aktywne wbudowane konto Gościa (Guest) umożliwia dostęp do zasobów systemu bez
      indywidualnego uwierzytelniania i ułatwia rekonesans środowiska lokalnego.
    collector:
      type: "windows_sam_account"
      account_name: "Guest"
    expected_state:
      operator: "equals"
      value: 0
    remediation: >
      Wyłącz konto Gościa w PowerShell: Disable-LocalUser -Name "Guest"
      (lub wykonaj: net user Guest /active:no).

  - rule_id: "WIN-CIS-18.9.102.2"
    os_family: "windows"
    category: "Remote Access & RDP Hardening"
    title: "Ensure 'Require user authentication for remote connections by using Network Level Authentication (RDP NLA)' is Enabled"
    benchmark_ref: "CIS Microsoft Windows Server 2022 Benchmark v3.0.0 - 18.9.102.2"
    mitre_attack: ["T1021.001", "T1110"]
    compliance_frameworks:
      iso27001: "A.8.5 (Bezpieczne uwierzytelnianie zdalne)"
      nis2: "Art. 21 ust. 2 lit. j (Bezpieczny dostęp zdalny)"
      ksc: "Zał. 1 pkt 11 (Ochrona sesji zdalnych RDP)"
    risk_severity: "HIGH"
    cvss_base_score: 8.4
    description: >
      Network Level Authentication (NLA) wymusza uwierzytelnienie użytkownika przed zestawieniem
      pełnej sesji graficznej RDP, chroniąc przed atakami typu Pre-Auth RCE (np. BlueKeep) i wyczerpaniem zasobów.
    collector:
      type: "windows_registry"
      hive: "HKEY_LOCAL_MACHINE"
      key_path: 'SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
      value_name: "UserAuthentication"
    expected_state:
      operator: "equals"
      value: 1
      expected_reg_type: "REG_DWORD"
    remediation: >
      Ustaw klucz HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp\UserAuthentication (DWORD) = 1.

  - rule_id: "WIN-CIS-18.9.10.1"
    os_family: "windows"
    category: "Hardware & Boot Integrity"
    title: "Ensure UEFI Secure Boot is enabled to prevent bootkit/rootkit execution"
    benchmark_ref: "CIS Microsoft Windows 11 Enterprise Benchmark v3.0.0 - 18.9.10.1"
    mitre_attack: ["T1542.003"]
    compliance_frameworks:
      iso27001: "A.8.9 (Integralność rozruchu platformy sprzętowej)"
      nis2: "Art. 21 ust. 2 lit. e (Integralność systemu operacyjnego)"
      ksc: "Zał. 1 pkt 4 (Weryfikacja podpisu kryptograficznego bootloadera)"
    risk_severity: "HIGH"
    cvss_base_score: 7.9
    description: >
      UEFI Secure Boot weryfikuje podpisy kryptograficzne programu rozruchowego (Bootloader)
      oraz sterowników jądra podczas startu maszyny, blokując rootkity typu BlackLotus.
    collector:
      type: "windows_registry"
      hive: "HKEY_LOCAL_MACHINE"
      key_path: 'SYSTEM\CurrentControlSet\Control\SecureBoot\State'
      value_name: "UEFISecureBootEnabled"
    expected_state:
      operator: "equals"
      value: 1
      expected_reg_type: "REG_DWORD"
    remediation: >
      Włącz opcję Secure Boot w ustawieniach firmware UEFI/BIOS płyty głównej oraz upewnij się,
      że system korzysta z partycjonowania GPT.

  - rule_id: "WIN-NET-SURFACE-01"
    os_family: "windows"
    category: "Network Attack Surface"
    title: "Ensure no high-risk cleartext or legacy TCP ports are listening (Telnet/23, FTP/21, RSH/514, TFTP/69)"
    benchmark_ref: "CIS Microsoft Windows Benchmark v3.0.0 - Section 9 / Network Surface"
    mitre_attack: ["T1046", "T1021"]
    compliance_frameworks:
      iso27001: "A.8.20 (Minimalizacja powierzchni ataku sieciowego)"
      nis2: "Art. 21 ust. 2 lit. e (Higiena ekspozycji portów sieciowych)"
      ksc: "Zał. 1 pkt 14 (Wyłączenie niezabezpieczonych protokołów)"
    risk_severity: "CRITICAL"
    cvss_base_score: 9.0
    description: >
      Nasłuchiwanie na portach nieszyfrowanych usług (Telnet 23, FTP 21, Rlogin 513, RSH 514)
      wystawia hosta na podsłuch poświadczeń oraz bezpośrednie zdalne przejęcie powłoki.
    collector:
      type: "network_listening_ports"
      forbidden_ports: [21, 23, 69, 513, 514]
    expected_state:
      operator: "equals"
      value: 0
    remediation: >
      Zatrzymaj i odinstaluj usługi nasłuchujące na niebezpiecznych portach (Telnet Server, FTP Server)
      oraz zablokuj te porty na zaporze: New-NetFirewallRule -DisplayName "Block Legacy Ports" -Direction Inbound -LocalPort 21,23,69,513,514 -Protocol TCP -Action Block.

  - rule_id: "WIN-CIS-18.9.30.2"
    os_family: "windows"
    category: "Network Protocol Hardening"
    title: "Ensure 'Turn off multicast name resolution' (LLMNR) is set to 'Enabled'"
    benchmark_ref: "CIS Microsoft Windows 11 Enterprise Benchmark v3.0.0 - 18.9.30.2"
    mitre_attack: ["T1557.001"]
    compliance_frameworks:
      iso27001: "A.8.20 (Zabezpieczenie protokołów rozpoznawania nazw)"
      nis2: "Art. 21 ust. 2 lit. e (Ochrona przed podsłuchem w sieci LAN)"
      ksc: "Zał. 1 pkt 14 (Wyłączenie podatnych mechanizmów multicastowych)"
    risk_severity: "HIGH"
    cvss_base_score: 7.5
    description: >
      LLMNR (Link-Local Multicast Name Resolution) umożliwia napastnikowi podszycie się
      pod nieistniejący zasób sieciowy i przechwycenie hashy NTLMv2 narzędziami typu Responder.
    collector:
      type: "windows_registry"
      hive: "HKEY_LOCAL_MACHINE"
      key_path: 'SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
      value_name: "EnableMulticast"
    expected_state:
      operator: "equals"
      value: 0
      expected_reg_type: "REG_DWORD"
    remediation: >
      W GPO: Computer Configuration -> Administrative Templates -> Network -> DNS Client ->
      Turn off multicast name resolution ustaw na Enabled (EnableMulticast = 0).

  - rule_id: "WIN-CIS-2.3.7.4"
    os_family: "windows"
    category: "Network Security"
    title: "Ensure 'Microsoft network client: Digitally sign communications (always)' is set to 'Enabled'"
    benchmark_ref: "CIS Microsoft Windows Server 2022 Benchmark v3.0.0 - 2.3.7.4"
    mitre_attack: ["T1557"]
    compliance_frameworks:
      iso27001: "A.8.24 (Kryptograficzny podpis sesji sieciowych)"
      nis2: "Art. 21 ust. 2 lit. h (Ochrona integralności protokołów)"
      ksc: "Zał. 1 pkt 12 (Wymuszenie podpisów kryptograficznych SMB)"
    risk_severity: "HIGH"
    cvss_base_score: 7.9
    description: >
      Wymuszenie podpisu cyfrowego pakietów SMB chroni komunikację przed atakami
      typu Man-in-the-Middle oraz NTLM/SMB Relay.
    collector:
      type: "windows_registry"
      hive: "HKEY_LOCAL_MACHINE"
      key_path: 'SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
      value_name: "RequireSecuritySignature"
    expected_state:
      operator: "equals"
      value: 1
      expected_reg_type: "REG_DWORD"
    remediation: >
      Ustaw klucz HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters\RequireSecuritySignature (DWORD) = 1.

  - rule_id: "WIN-CIS-18.9.5.1"
    os_family: "windows"
    category: "Endpoint Protection & Antivirus"
    title: "Ensure 'Windows Defender Antivirus: Real-time Protection' is Enabled"
    benchmark_ref: "CIS Microsoft Windows 11 Enterprise Benchmark v3.0.0 - 18.9.5.1"
    mitre_attack: ["T1562.001"]
    compliance_frameworks:
      iso27001: "A.8.7 (Ochrona przed złośliwym oprogramowaniem)"
      nis2: "Art. 21 ust. 2 lit. e (Ciągłe skanowanie punktów końcowych)"
      ksc: "Zał. 1 pkt 17 (Aktywna ochrona antywirusowa w czasie rzeczywistym)"
    risk_severity: "CRITICAL"
    cvss_base_score: 9.1
    description: >
      Skanowanie w czasie rzeczywistym jest kluczowym komponentem antywirusa Windows Defender.
      Wyłączenie tej opcji uniemożliwia natychmiastowe blokowanie złośliwych plików.
    collector:
      type: "windows_registry"
      hive: "HKEY_LOCAL_MACHINE"
      key_path: 'SOFTWARE\Microsoft\Windows Defender\Real-Time Protection'
      value_name: "DisableRealtimeMonitoring"
    expected_state:
      operator: "in_set"
      allowed_values: [0, null]
      expected_reg_type: "REG_DWORD"
    remediation: >
      Ustaw klucz HKLM\SOFTWARE\Microsoft\Windows Defender\Real-Time Protection\DisableRealtimeMonitoring (DWORD) = 0.

  - rule_id: "WIN-CIS-18.8.19.2"
    os_family: "windows"
    category: "Credential Protection"
    title: "Ensure 'Do not allow passwords to be saved' in Remote Desktop Connection is Enabled"
    benchmark_ref: "CIS Microsoft Windows 11 Enterprise Benchmark v3.0.0 - 18.8.19.2"
    mitre_attack: ["T1555"]
    compliance_frameworks:
      iso27001: "A.5.17 (Ochrona zapisanych poświadczeń użytkowników)"
      nis2: "Art. 21 ust. 2 lit. j (Higiena poświadczeń sesji zdalnych)"
      ksc: "Zał. 1 pkt 8 (Blokada trwałego buforowania haseł w systemie)"
    risk_severity: "MEDIUM"
    cvss_base_score: 6.2
    description: >
      Zezwalanie na zapamiętywanie haseł RDP umożliwia napastnikowi po przejęciu stacji roboczej
      odczytanie zapisanych haseł do serwerów z menedżera poświadczeń.
    collector:
      type: "windows_registry"
      hive: "HKEY_LOCAL_MACHINE"
      key_path: 'SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      value_name: "DisablePasswordSaving"
    expected_state:
      operator: "equals"
      value: 1
      expected_reg_type: "REG_DWORD"
    remediation: >
      Ustaw klucz HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\DisablePasswordSaving (DWORD) = 1.

  - rule_id: "WIN-CIS-18.5.11.2"
    os_family: "windows"
    category: "Removable Media & Peripherals"
    title: "Ensure 'Turn off Autoplay' is set to 'Enabled: All drives'"
    benchmark_ref: "CIS Microsoft Windows 11 Enterprise Benchmark v3.0.0 - 18.5.11.2"
    mitre_attack: ["T1091"]
    compliance_frameworks:
      iso27001: "A.7.10 (Ochrona nośników wymiennych)"
      nis2: "Art. 21 ust. 2 lit. e (Ochrona przed atakami przez porty USB)"
      ksc: "Zał. 1 pkt 19 (Blokada automatycznego wykonywania kodu z nośników)"
    risk_severity: "HIGH"
    cvss_base_score: 7.2
    description: >
      Autoodtwarzanie pozwala na natychmiastowe wykonanie kodu z podłączonych pamięci USB
      lub płyt CD/DVD, co stanowi częsty wektor infekcji robakami i atakami BadUSB.
    collector:
      type: "windows_registry"
      hive: "HKEY_LOCAL_MACHINE"
      key_path: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      value_name: "NoDriveTypeAutoRun"
    expected_state:
      operator: "equals"
      value: 255
      expected_reg_type: "REG_DWORD"
    remediation: >
      Ustaw klucz HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoDriveTypeAutoRun (DWORD) = 255.

  - rule_id: "WIN-CIS-18.9.15.1"
    os_family: "windows"
    category: "Data-at-Rest & Encryption"
    title: "Ensure BitLocker Drive Encryption protection is active on System Volume (C:)"
    benchmark_ref: "CIS Microsoft Windows 11 Enterprise Benchmark v3.0.0 - 18.9.15.1"
    mitre_attack: ["T1005"]
    compliance_frameworks:
      iso27001: "A.8.24 (Szyfrowanie dysków i danych spoczynkowych)"
      nis2: "Art. 21 ust. 2 lit. h (Szyfrowanie magazynów danych)"
      ksc: "Zał. 1 pkt 10 (Ochrona kryptograficzna pamięci masowych)"
    risk_severity: "HIGH"
    cvss_base_score: 8.0
    description: >
      Szyfrowanie dysku systemowego za pomocą BitLocker uniemożliwia odczyt danych i haseł
      po kradzieży dysku lub uruchomieniu maszyny z zewnętrznego systemu live-USB.
    collector:
      type: "windows_bitlocker_status"
      target_drive: "C:"
    expected_state:
      operator: "equals"
      value: 1
    remediation: >
      Włącz BitLocker dla dysku C:: Enable-BitLocker -MountPoint "C:" -EncryptionMethod XtsAes256 -UsedSpaceOnly -TpmProtector.

  - rule_id: "WIN-CIS-2.3.1.5"
    os_family: "windows"
    category: "Password & Account Policies"
    title: "Ensure 'Accounts: Administrator account status' is set to 'Disabled' or renamed"
    benchmark_ref: "CIS Microsoft Windows 11 Enterprise Benchmark v3.0.0 - 2.3.1.5"
    mitre_attack: ["T1078.001"]
    compliance_frameworks:
      iso27001: "A.8.2 (Ograniczenie domyślnych kont administracyjnych)"
      nis2: "Art. 21 ust. 2 lit. i (Kontrola kont o najwyższych uprawnieniach)"
      ksc: "Zał. 1 pkt 6 (Zabezpieczenie konta Administrator)"
    risk_severity: "HIGH"
    cvss_base_score: 7.7
    description: >
      Wbudowane konto Administrator posiada znany identyfikator SID (-500) i nie podlega
      blokadzie po błędnych próbach logowania, co czyni je głównym celem ataków brute-force.
    collector:
      type: "windows_sam_admin_status"
      target: "Win32API::NetUserGetInfo(Administrator)"
    expected_state:
      operator: "equals"
      value: 0
    remediation: >
      Wyłącz wbudowane konto Administrator: Disable-LocalUser -Name "Administrator" (lub zmień jego nazwę w GPO).

  - rule_id: "WIN-CIS-18.9.84.1"
    os_family: "windows"
    category: "Remote Management & WinRM"
    title: "Ensure Windows Remote Management (WinRM) Basic Authentication is disabled"
    benchmark_ref: "CIS Microsoft Windows Server 2022 Benchmark v3.0.0 - 18.9.84.1"
    mitre_attack: ["T1021.006"]
    compliance_frameworks:
      iso27001: "A.8.24 (Bezpieczne protokoły zarządzania zdalnego)"
      nis2: "Art. 21 ust. 2 lit. j (Eliminacja uwierzytelniania tekstem jawnym)"
      ksc: "Zał. 1 pkt 11 (Ochrona usług zdalnego zarządzania)"
    risk_severity: "HIGH"
    cvss_base_score: 7.8
    description: >
      Podstawowe uwierzytelnianie (Basic Auth) w protokole WinRM przesyła poświadczenia
      w postaci słabo chronionej, co naraża sesję administracyjną na podsłuch i kradzież poświadczeń.
    collector:
      type: "windows_registry"
      hive: "HKEY_LOCAL_MACHINE"
      key_path: 'SOFTWARE\Policies\Microsoft\Windows\WinRM\Client'
      value_name: "AllowBasic"
    expected_state:
      operator: "in_set"
      allowed_values: [0, null]
      expected_reg_type: "REG_DWORD"
    remediation: >
      Ustaw klucz HKLM\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client\AllowBasic (DWORD) = 0
      oraz HKLM\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service\AllowBasic (DWORD) = 0.

  - rule_id: "WIN-CIS-18.9.102.3"
    os_family: "windows"
    category: "Session Management & Screen Lock"
    title: "Ensure 'Machine inactivity limit' is set to 900 or fewer seconds (Screen Saver Lockout)"
    benchmark_ref: "CIS Microsoft Windows 11 Enterprise Benchmark v3.0.0 - 18.9.102.3"
    mitre_attack: ["T1078"]
    compliance_frameworks:
      iso27001: "A.7.7 (Czyste biurko i czysty ekran)"
      nis2: "Art. 21 ust. 2 lit. g (Automatyczna blokada nieaktywnych sesji)"
      ksc: "Zał. 1 pkt 8 (Wygaszanie i blokada stacji roboczych)"
    risk_severity: "MEDIUM"
    cvss_base_score: 5.3
    description: >
      Pozostawienie odblokowanej stacji roboczej po odejściu pracownika pozwala osobom
      trzecim na bezpośredni dostęp do systemów organizacji bez znajomości hasła.
    collector:
      type: "windows_registry"
      hive: "HKEY_LOCAL_MACHINE"
      key_path: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      value_name: "InactivityTimeoutSecs"
    expected_state:
      operator: "greater_than_or_equal"
      value: 60
    remediation: >
      W GPO: Computer Configuration -> Windows Settings -> Security Settings -> Local Policies ->
      Security Options -> Interactive logon: Machine inactivity limit ustaw na maksymalnie 900 sekund (15 min).

  - rule_id: "WIN-CIS-18.4.1"
    os_family: "windows"
    category: "Cryptography & PKI"
    title: "Ensure 'Strong private key protection for stored certificates' is enforced"
    benchmark_ref: "CIS Microsoft Windows 11 Enterprise Benchmark v3.0.0 - 18.4.1"
    mitre_attack: ["T1552.004"]
    compliance_frameworks:
      iso27001: "A.8.24 (Ochrona kluczy prywatnych kryptografii)"
      nis2: "Art. 21 ust. 2 lit. h (Bezpieczeństwo certyfikatów i kluczy)"
      ksc: "Zał. 1 pkt 12 (Izolacja kluczy kryptograficznych w magazynie CryptoAPI)"
    risk_severity: "MEDIUM"
    cvss_base_score: 6.8
    description: >
      Wymuszenie ochrony kluczy prywatnych certyfikatów X.509 użytkowników zapobiega
      ich cichemu eksportowi przez nieautoryzowane procesy pracujące w tle.
    collector:
      type: "windows_registry"
      hive: "HKEY_LOCAL_MACHINE"
      key_path: 'SOFTWARE\Policies\Microsoft\Cryptography'
      value_name: "ForceKeyProtection"
    expected_state:
      operator: "in_set"
      allowed_values: [1, 2]
      expected_reg_type: "REG_DWORD"
    remediation: >
      Ustaw klucz HKLM\SOFTWARE\Policies\Microsoft\Cryptography\ForceKeyProtection (DWORD) = 2.

  # ============================================================================
  # LINUX (DEBIAN / UBUNTU) CIS BENCHMARK & ATTACK SURFACE RULES (20 REGUŁ)
  # ============================================================================

  - rule_id: "LNX-CIS-5.2.8"
    os_family: "linux"
    os_distro: ["debian", "ubuntu"]
    category: "SSH Hardening"
    title: "Ensure SSH root login is disabled"
    benchmark_ref: "CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0 - 5.2.8"
    mitre_attack: ["T1078.003", "T1021.004"]
    compliance_frameworks:
      iso27001: "A.8.2 (Prawa dostępu uprzywilejowanego)"
      nis2: "Art. 21 ust. 2 lit. i (Kontrola dostępu uprzywilejowanego)"
      ksc: "Zał. 1 pkt 7 (Rozliczalność działań administratorów)"
    risk_severity: "CRITICAL"
    cvss_base_score: 9.0
    description: >
      Logowanie bezpośrednio na konto root przez SSH uniemożliwia rozliczalność działań
      poszczególnych administratorów i wystawia konto o najwyższych uprawnieniach na brute-force.
    collector:
      type: "linux_sshd_effective_config"
      binary_path: "/usr/sbin/sshd"
      args: ["-T"]
      config_path: "/etc/ssh/sshd_config"
      directive: "permitrootlogin"
    expected_state:
      operator: "equals"
      value: "no"
      case_sensitive: false
    remediation: >
      W pliku /etc/ssh/sshd_config ustaw: PermitRootLogin no
      Następnie wykonaj: systemctl reload sshd

  - rule_id: "LNX-CIS-3.1.1"
    os_family: "linux"
    os_distro: ["debian", "ubuntu"]
    category: "Kernel Network Hardening"
    title: "Ensure IPv4 packet forwarding is disabled"
    benchmark_ref: "CIS Debian Linux 12 Benchmark v1.0.0 - 3.1.1"
    mitre_attack: ["T1090"]
    compliance_frameworks:
      iso27001: "A.8.20 (Bezpieczeństwo sieci)"
      nis2: "Art. 21 ust. 2 lit. e (Zapobieganie nieautoryzowanemu routingowi)"
      ksc: "Zał. 1 pkt 14 (Izolacja segmentów sieciowych)"
    risk_severity: "MEDIUM"
    cvss_base_score: 6.1
    description: >
      Serwery niebędące dedykowanymi routerami nie powinny przekazywać pakietów IP pomiędzy
      interfejsami sieciowymi, aby zapobiec wykorzystaniu hosta jako węzła pivotującego.
    collector:
      type: "linux_proc_sysctl"
      sysctl_keys:
        - "net.ipv4.ip_forward"
    expected_state:
      operator: "equals"
      value: 0
    remediation: >
      Ustaw net.ipv4.ip_forward = 0 w /etc/sysctl.d/60-cis-net.conf oraz wykonaj:
      sysctl -w net.ipv4.ip_forward=0

  - rule_id: "LNX-CIS-3.3.5"
    os_family: "linux"
    os_distro: ["debian", "ubuntu"]
    category: "Kernel Network Hardening"
    title: "Ensure ICMP redirects are not accepted"
    benchmark_ref: "CIS Debian Linux 12 Benchmark v1.0.0 - 3.3.5"
    mitre_attack: ["T1557"]
    compliance_frameworks:
      iso27001: "A.8.20 (Ochrona przed manipulacją routingiem ICMP)"
      nis2: "Art. 21 ust. 2 lit. e (Ochrona komunikacji sieciowej)"
      ksc: "Zał. 1 pkt 15 (Ochrona przed atakami MitM w sieci LAN)"
    risk_severity: "MEDIUM"
    cvss_base_score: 5.9
    description: >
      Komunikaty ICMP Redirect mogą zostać wykorzystane przez atakującego w sieci LAN
      do zmodyfikowania tablic routingu hosta i przeprowadzenia ataku Man-in-the-Middle (MitM).
    collector:
      type: "linux_proc_sysctl"
      sysctl_keys:
        - "net.ipv4.conf.all.accept_redirects"
        - "net.ipv4.conf.default.accept_redirects"
    expected_state:
      operator: "all_equal"
      value: 0
    remediation: >
      Ustaw net.ipv4.conf.all.accept_redirects=0 oraz net.ipv4.conf.default.accept_redirects=0
      w /etc/sysctl.d/60-cis-net.conf i przeładuj sysctl --system.

  - rule_id: "LNX-CIS-6.1.10"
    os_family: "linux"
    os_distro: ["debian", "ubuntu"]
    category: "Filesystem Integrity & Permissions"
    title: "Ensure permissions on /etc/shadow are configured (0640 or more restrictive)"
    benchmark_ref: "CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0 - 6.1.10"
    mitre_attack: ["T1003.008"]
    compliance_frameworks:
      iso27001: "A.5.17 (Ochrona magazynu skrótów haseł)"
      nis2: "Art. 21 ust. 2 lit. i (Ochrona poufności poświadczeń)"
      ksc: "Zał. 1 pkt 9 (Restrykcyjne uprawnienia plików haseł)"
    risk_severity: "CRITICAL"
    cvss_base_score: 8.8
    description: >
      Plik /etc/shadow zawiera skróty haseł wszystkich kont lokalnych. Odczyt przez nieuprawnionego
      użytkownika pozwala na przeprowadzenie ataku słownikowego offline (Hashcat / John the Ripper).
    collector:
      type: "linux_file_stat"
      target_path: "/etc/shadow"
    expected_state:
      operator: "file_acl_match"
      expected_uid: 0
      expected_owner: "root"
      allowed_groups: ["root", "shadow"]
      forbidden_mode_bits_octal: "0137"
    remediation: >
      Wykonaj: chown root:shadow /etc/shadow && chmod u-x,g-wx,o-rwx /etc/shadow

  - rule_id: "LNX-CIS-1.5.1"
    os_family: "linux"
    os_distro: ["debian", "ubuntu"]
    category: "Kernel Memory Protection"
    title: "Ensure Address Space Layout Randomization (ASLR) is fully enabled (randomize_va_space = 2)"
    benchmark_ref: "CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0 - 1.5.1"
    mitre_attack: ["T1203", "T1068"]
    compliance_frameworks:
      iso27001: "A.8.9 (Utwardzanie pamięci jądra systemu)"
      nis2: "Art. 21 ust. 2 lit. e (Ochrona przed eksploitacją luk pamięci)"
      ksc: "Zał. 1 pkt 4 (Mechanizmy ochrony przestrzeni adresowej ASLR)"
    risk_severity: "HIGH"
    cvss_base_score: 7.8
    description: >
      Pełny ASLR (wartość 2) losowo rozmieszcza stos, stertę (heap), biblioteki współdzielone
      oraz segmenty mmap w przestrzeni adresowej procesu, utrudniając eksploity typu ROP / Buffer Overflow.
    collector:
      type: "linux_proc_sysctl"
      sysctl_keys:
        - "kernel.randomize_va_space"
    expected_state:
      operator: "equals"
      value: 2
    remediation: >
      Ustaw kernel.randomize_va_space = 2 w /etc/sysctl.d/60-kernel_sysctl.conf i wykonaj:
      sysctl -w kernel.randomize_va_space=2

  - rule_id: "LNX-CIS-4.1.1.1"
    os_family: "linux"
    os_distro: ["debian", "ubuntu"]
    category: "Audit & Logging"
    title: "Ensure auditd service is enabled and active"
    benchmark_ref: "CIS Debian Linux 12 Benchmark v1.0.0 - 4.1.1.1"
    mitre_attack: ["T1562.001"]
    compliance_frameworks:
      iso27001: "A.8.15 (Rejestrowanie wywołań systemowych i audyt)"
      nis2: "Art. 21 ust. 2 lit. b (Monitorowanie ciągłe i detekcja incydentów)"
      ksc: "Zał. 1 pkt 18 (Ciągła rejestracja zdarzeń bezpieczeństwa)"
    risk_severity: "HIGH"
    cvss_base_score: 7.4
    description: >
      Demon Linux Audit (auditd) odpowiada za rejestrowanie wywołań systemowych jądra,
      zmian w plikach krytycznych (/etc/passwd, /etc/sudoers) oraz prób eskalacji uprawnień.
    collector:
      type: "linux_systemd_service"
      service_name: "auditd.service"
    expected_state:
      operator: "equals"
      value: "active"
    remediation: >
      Zainstaluj i aktywuj usługę: apt install auditd && systemctl --now enable auditd

  - rule_id: "LNX-CIS-6.2.5"
    os_family: "linux"
    os_distro: ["debian", "ubuntu"]
    category: "Privilege Escalation"
    title: "Ensure root is the only UID 0 account in /etc/passwd"
    benchmark_ref: "CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0 - 6.2.5"
    mitre_attack: ["T1136.001", "T1078.003"]
    compliance_frameworks:
      iso27001: "A.8.2 (Unikalność konta superużytkownika UID 0)"
      nis2: "Art. 21 ust. 2 lit. i (Zarządzanie tożsamościami uprzywilejowanymi)"
      ksc: "Zał. 1 pkt 7 (Wykrywanie ukrytych kont administracyjnych backdoor)"
    risk_severity: "CRITICAL"
    cvss_base_score: 9.6
    description: >
      Każde konto w pliku /etc/passwd posiadające UID=0 otrzymuje pełne prawa superużytkownika
      jądra Linux. Obecność dodatkowych kont z UID=0 poza 'root' wskazuje na tylną furtkę (backdoor).
    collector:
      type: "linux_passwd_uid0"
      target_path: "/etc/passwd"
    expected_state:
      operator: "equals"
      value: 0
    remediation: >
      Usuń lub zmień UID wszelkich kont innych niż root posiadających UID 0 w pliku /etc/passwd:
      usermod -u <nowy_uid> <nazwa_konta> lub userdel -r <nazwa_konta>.

  - rule_id: "LNX-CIS-5.3.3"
    os_family: "linux"
    os_distro: ["debian", "ubuntu"]
    category: "Privilege Escalation"
    title: "Ensure sudoers configuration does not allow passwordless privilege escalation (NOPASSWD)"
    benchmark_ref: "CIS Debian Linux 12 Benchmark v1.0.0 - 5.3.3"
    mitre_attack: ["T1548.003"]
    compliance_frameworks:
      iso27001: "A.8.2 (Weryfikacja tożsamości przy eskalacji uprawnień)"
      nis2: "Art. 21 ust. 2 lit. i (Kontrola dostępu uprzywilejowanego)"
      ksc: "Zał. 1 pkt 8 (Wymóg uwierzytelniania przy operacjach administracyjnych)"
    risk_severity: "HIGH"
    cvss_base_score: 8.3
    description: >
      Dyrektywa NOPASSWD w /etc/sudoers lub /etc/sudoers.d/* pozwala na przejęcie pełnych uprawnień
      root z poziomu przejętej sesji zwykłego użytkownika bez znajomości hasła.
    collector:
      type: "linux_sudoers_nopasswd"
      target_path: "/etc/sudoers"
    expected_state:
      operator: "equals"
      value: 0
    remediation: >
      Edytuj /etc/sudoers za pomocą polecenia visudo oraz pliki w /etc/sudoers.d/ i usuń wszystkie wpisy zawierające tag NOPASSWD.

  - rule_id: "LNX-CIS-1.4.1"
    os_family: "linux"
    os_distro: ["debian", "ubuntu"]
    category: "Hardware & Boot Integrity"
    title: "Ensure bootloader configuration (/boot/grub/grub.cfg) permissions are 0400/0600 root:root"
    benchmark_ref: "CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0 - 1.4.1"
    mitre_attack: ["T1542.003"]
    compliance_frameworks:
      iso27001: "A.8.9 (Ochrona parametrów startowych jądra)"
      nis2: "Art. 21 ust. 2 lit. e (Integralność rozruchu systemu)"
      ksc: "Zał. 1 pkt 4 (Zabezpieczenie konfiguracji programu rozruchowego GRUB)"
    risk_severity: "HIGH"
    cvss_base_score: 7.6
    description: >
      Nieodpowiednie uprawnienia pliku /boot/grub/grub.cfg pozwalają lokalnym użytkownikom na odczyt
      skrótów haseł GRUB lub modyfikację parametrów startowych jądra (np. init=/bin/sh).
    collector:
      type: "linux_file_stat"
      target_path: "/boot/grub/grub.cfg"
    expected_state:
      operator: "file_acl_match"
      expected_uid: 0
      expected_owner: "root"
      allowed_groups: ["root"]
      forbidden_mode_bits_octal: "0177"
    remediation: >
      Wykonaj: chown root:root /boot/grub/grub.cfg && chmod u-x,go-rwx /boot/grub/grub.cfg

  - rule_id: "LNX-NET-SURFACE-01"
    os_family: "linux"
    os_distro: ["debian", "ubuntu"]
    category: "Network Attack Surface"
    title: "Ensure no high-risk cleartext TCP ports are listening (Telnet/23, FTP/21, RSH/514, X11/6000)"
    benchmark_ref: "CIS Linux Benchmark v1.0.0 - Section 2.1 / Network Surface"
    mitre_attack: ["T1046", "T1021"]
    compliance_frameworks:
      iso27001: "A.8.20 (Minimalizacja powierzchni ataku sieciowego)"
      nis2: "Art. 21 ust. 2 lit. e (Higiena ekspozycji portów sieciowych)"
      ksc: "Zał. 1 pkt 14 (Wyłączenie niezabezpieczonych usług sieciowych)"
    risk_severity: "CRITICAL"
    cvss_base_score: 9.0
    description: >
      Otwarte porty usług nieszyfrowanych w /proc/net/tcp (Telnet 23, FTP 21, Rlogin 513, RSH 514, X11 6000)
      narażają serwer na przejęcie sesji oraz zdalną eksploitację.
    collector:
      type: "network_listening_ports"
      forbidden_ports: [21, 23, 69, 513, 514, 6000]
    expected_state:
      operator: "equals"
      value: 0
    remediation: >
      Wyłącz niebezpieczne demony (systemctl stop telnet.socket vsftpd rsh.socket) oraz zablokuj ruch przychodzący w nftables/ufw.

  - rule_id: "LNX-CIS-1.6.1"
    os_family: "linux"
    os_distro: ["debian", "ubuntu"]
    category: "Mandatory Access Control"
    title: "Ensure AppArmor or SELinux is installed, enabled, and in enforcing mode"
    benchmark_ref: "CIS Debian Linux 12 Benchmark v1.0.0 - 1.6.1"
    mitre_attack: ["T1068", "T1548"]
    compliance_frameworks:
      iso27001: "A.8.2 (Ograniczenie praw dostępu i izolacja procesów)"
      nis2: "Art. 21 ust. 2 lit. e (Ochrona przed eskalacją uprawnień w jądrze)"
      ksc: "Zał. 1 pkt 4 (Stosowanie mechanizmów Mandatory Access Control MAC)"
    risk_severity: "HIGH"
    cvss_base_score: 8.2
    description: >
      Systemy Mandatory Access Control (AppArmor / SELinux) wymuszają granularne reguły
      dostępu do plików, gniazd i pamięci, ograniczając skutki podatności w aplikacjach.
    collector:
      type: "linux_mac_status"
    expected_state:
      operator: "in_set"
      allowed_values: ["enforcing", "active"]
    remediation: >
      Włącz AppArmor: systemctl enable --now apparmor && aa-enforce /etc/apparmor.d/*
      (lub ustaw SELINUX=enforcing w /etc/selinux/config).

  - rule_id: "LNX-CIS-3.3.1"
    os_family: "linux"
    os_distro: ["debian", "ubuntu"]
    category: "Kernel Network Hardening"
    title: "Ensure source routed packets are not accepted (accept_source_route = 0)"
    benchmark_ref: "CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0 - 3.3.1"
    mitre_attack: ["T1090"]
    compliance_frameworks:
      iso27001: "A.8.20 (Zabezpieczenie routingu pakietów)"
      nis2: "Art. 21 ust. 2 lit. e (Ochrona przed podszywaniem się pod IP)"
      ksc: "Zał. 1 pkt 15 (Ochrona przed atakami Source Routing)"
    risk_severity: "MEDIUM"
    cvss_base_score: 5.8
    description: >
      Pakiety Source Routing pozwalają nadawcy na określenie dokładnej trasy przez sieć,
      co może posłużyć do ominięcia zapór sieciowych i mechanizmów filtrowania.
    collector:
      type: "linux_proc_sysctl"
      sysctl_keys:
        - "net.ipv4.conf.all.accept_source_route"
        - "net.ipv4.conf.default.accept_source_route"
    expected_state:
      operator: "all_equal"
      value: 0
    remediation: >
      Ustaw net.ipv4.conf.all.accept_source_route=0 oraz net.ipv4.conf.default.accept_source_route=0
      w /etc/sysctl.d/60-cis-net.conf i przeładuj sysctl --system.

  - rule_id: "LNX-CIS-3.3.2"
    os_family: "linux"
    os_distro: ["debian", "ubuntu"]
    category: "Kernel Network Hardening"
    title: "Ensure TCP SYN Cookies are enabled (net.ipv4.tcp_syncookies = 1)"
    benchmark_ref: "CIS Debian Linux 12 Benchmark v1.0.0 - 3.3.2"
    mitre_attack: ["T1498"]
    compliance_frameworks:
      iso27001: "A.8.20 (Ochrona przed atakami typu Denial-of-Service)"
      nis2: "Art. 21 ust. 2 lit. d (Ciągłość działania i odporność na ataki DoS)"
      ksc: "Zał. 1 pkt 16 (Mechanizmy obrony przed zalewaniem SYN Flood)"
    risk_severity: "HIGH"
    cvss_base_score: 7.5
    description: >
      Mechanizm SYN Cookies chroni serwer przed atakami typu SYN Flood, zapobiegając
      wyczerpaniu kolejki połączeń przychodzących w jądrze Linux.
    collector:
      type: "linux_proc_sysctl"
      sysctl_keys:
        - "net.ipv4.tcp_syncookies"
    expected_state:
      operator: "equals"
      value: 1
    remediation: >
      Ustaw net.ipv4.tcp_syncookies = 1 w /etc/sysctl.d/60-cis-net.conf i wykonaj: sysctl -w net.ipv4.tcp_syncookies=1.

  - rule_id: "LNX-CIS-5.4.1.1"
    os_family: "linux"
    os_distro: ["debian", "ubuntu"]
    category: "Password & Account Policies"
    title: "Ensure password hashing algorithm is SHA-512 or YESCRYPT"
    benchmark_ref: "CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0 - 5.4.1.1"
    mitre_attack: ["T1110"]
    compliance_frameworks:
      iso27001: "A.5.17 (Stosowanie nowoczesnej kryptografii haseł)"
      nis2: "Art. 21 ust. 2 lit. h (Higiena kryptograficzna poświadczeń)"
      ksc: "Zał. 1 pkt 8 (Wymóg silnego algorytmu SHA-512/Yescrypt dla haseł)"
    risk_severity: "HIGH"
    cvss_base_score: 8.1
    description: >
      Stosowanie przestarzałych skrótów haseł (MD5 lub DES) w /etc/shadow umożliwia
      błyskawiczne złamanie haseł przez atakującego narzędziami Hashcat / John the Ripper.
    collector:
      type: "linux_login_defs"
      parameter: "ENCRYPT_METHOD"
    expected_state:
      operator: "in_set"
      allowed_values: ["SHA512", "YESCRYPT"]
    remediation: >
      W pliku /etc/login.defs ustaw: ENCRYPT_METHOD YESCRYPT (lub ENCRYPT_METHOD SHA512).

  - rule_id: "LNX-CIS-5.2.10"
    os_family: "linux"
    os_distro: ["debian", "ubuntu"]
    category: "SSH Hardening"
    title: "Ensure SSH password authentication is disabled (require public key authentication)"
    benchmark_ref: "CIS Debian Linux 12 Benchmark v1.0.0 - 5.2.10"
    mitre_attack: ["T1110.001", "T1021.004"]
    compliance_frameworks:
      iso27001: "A.8.5 (Uwierzytelnianie bezpiecznymi kluczami kryptograficznymi)"
      nis2: "Art. 21 ust. 2 lit. j (Wyeliminowanie haseł statycznych w dostępie zdalnym)"
      ksc: "Zał. 1 pkt 11 (Wymóg uwierzytelniania asymetrycznego w SSH)"
    risk_severity: "HIGH"
    cvss_base_score: 8.0
    description: >
      Wyłączenie uwierzytelniania hasłem w usłudze SSH eliminuje ryzyko udanego ataku
      brute-force i zmusza administratorów do stosowania bezpiecznych kluczy Ed25519 / RSA.
    collector:
      type: "linux_sshd_effective_config"
      directive: "passwordauthentication"
    expected_state:
      operator: "equals"
      value: "no"
      case_sensitive: false
    remediation: >
      W /etc/ssh/sshd_config ustaw: PasswordAuthentication no i wykonaj: systemctl reload sshd.

  - rule_id: "LNX-CIS-1.7.1"
    os_family: "linux"
    os_distro: ["debian", "ubuntu"]
    category: "Kernel Memory Protection"
    title: "Ensure core dumps of SUID programs are restricted (fs.suid_dumpable = 0)"
    benchmark_ref: "CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0 - 1.7.1"
    mitre_attack: ["T1003"]
    compliance_frameworks:
      iso27001: "A.8.7 (Ochrona pamięci procesów przed wyciekiem)"
      nis2: "Art. 21 ust. 2 lit. e (Ochrona poświadczeń w pamięci RAM)"
      ksc: "Zał. 1 pkt 9 (Blokada zrzutów pamięci procesów uprzywilejowanych SUID)"
    risk_severity: "MEDIUM"
    cvss_base_score: 6.5
    description: >
      Zrzuty pamięci (Core Dumps) programów działających z uprawnieniami SUID/SGID mogą
      zawierać wrażliwe dane, w tym hasła w postaci jawnej, klucze sesji i tokeny.
    collector:
      type: "linux_proc_sysctl"
      sysctl_keys:
        - "fs.suid_dumpable"
    expected_state:
      operator: "equals"
      value: 0
    remediation: >
      Ustaw fs.suid_dumpable = 0 w /etc/sysctl.d/60-cis-kernel.conf i wykonaj: sysctl -w fs.suid_dumpable=0.

  - rule_id: "LNX-CIS-5.1.1"
    os_family: "linux"
    os_distro: ["debian", "ubuntu"]
    category: "Filesystem Integrity & Permissions"
    title: "Ensure permissions on /etc/crontab are configured (0600 root:root)"
    benchmark_ref: "CIS Debian Linux 12 Benchmark v1.0.0 - 5.1.1"
    mitre_attack: ["T1053.003"]
    compliance_frameworks:
      iso27001: "A.8.9 (Integralność harmonogramu zadań systemowych)"
      nis2: "Art. 21 ust. 2 lit. e (Ochrona przed nieautoryzowanym uruchamianiem zadań)"
      ksc: "Zał. 1 pkt 7 (Kontrola uprawnień plików harmonogramu zadań cron)"
    risk_severity: "HIGH"
    cvss_base_score: 7.8
    description: >
      Nieuprawniony zapis do /etc/crontab pozwala lokalnemu użytkownikowi na natychmiastową
      eskalację uprawnień do poziomu root poprzez dopisanie własnego złośliwego zadania.
    collector:
      type: "linux_file_stat"
      target_path: "/etc/crontab"
    expected_state:
      operator: "file_acl_match"
      expected_uid: 0
      expected_owner: "root"
      allowed_groups: ["root"]
      forbidden_mode_bits_octal: "0177"
    remediation: >
      Wykonaj: chown root:root /etc/crontab && chmod 0600 /etc/crontab.

  - rule_id: "LNX-CIS-3.2.2"
    os_family: "linux"
    os_distro: ["debian", "ubuntu"]
    category: "Kernel Network Hardening"
    title: "Ensure ICMP broadcast echo requests are ignored (Smurf attack protection)"
    benchmark_ref: "CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0 - 3.2.2"
    mitre_attack: ["T1498"]
    compliance_frameworks:
      iso27001: "A.8.20 (Ochrona sieci przed atakami amplifikacyjnymi)"
      nis2: "Art. 21 ust. 2 lit. d (Odporność na ataki DoS / Smurf)"
      ksc: "Zał. 1 pkt 16 (Ignorowanie zapytań rozgłoszeniowych ICMP)"
    risk_severity: "LOW"
    cvss_base_score: 4.8
    description: >
      Odpowiadanie na pakiety ICMP Echo wysyłane na adres rozgłoszeniowy (Broadcast) może
      zostać wykorzystane do ataków amplifikacyjnych DoS (Smurf Attack).
    collector:
      type: "linux_proc_sysctl"
      sysctl_keys:
        - "net.ipv4.icmp_echo_ignore_broadcasts"
    expected_state:
      operator: "equals"
      value: 1
    remediation: >
      Ustaw net.ipv4.icmp_echo_ignore_broadcasts = 1 w /etc/sysctl.d/60-cis-net.conf i wykonaj: sysctl -w net.ipv4.icmp_echo_ignore_broadcasts=1.

  - rule_id: "LNX-CIS-3.2.4"
    os_family: "linux"
    os_distro: ["debian", "ubuntu"]
    category: "Kernel Network Hardening"
    title: "Ensure suspicious packets (Martians) are logged"
    benchmark_ref: "CIS Debian Linux 12 Benchmark v1.0.0 - 3.2.4"
    mitre_attack: ["T1046"]
    compliance_frameworks:
      iso27001: "A.8.15 (Rejestrowanie zdarzeń sieciowych i anomalii)"
      nis2: "Art. 21 ust. 2 lit. b (Wykrywanie pakietów ze sfałszowanym adresem źródłowym)"
      ksc: "Zał. 1 pkt 18 (Monitorowanie anomalii pakietów w jądrze)"
    risk_severity: "LOW"
    cvss_base_score: 4.5
    description: >
      Logowanie pakietów ze sfałszowanym lub niemożliwym do wytrasowania adresem (Martian Packets)
      ułatwia wykrywanie prób skanowania i spoofingu sieciowego.
    collector:
      type: "linux_proc_sysctl"
      sysctl_keys:
        - "net.ipv4.conf.all.log_martians"
        - "net.ipv4.conf.default.log_martians"
    expected_state:
      operator: "all_equal"
      value: 1
    remediation: >
      Ustaw net.ipv4.conf.all.log_martians = 1 oraz net.ipv4.conf.default.log_martians = 1 w /etc/sysctl.d/60-cis-net.conf.

  - rule_id: "LNX-CIS-5.4.4"
    os_family: "linux"
    os_distro: ["debian", "ubuntu"]
    category: "Filesystem Integrity & Permissions"
    title: "Ensure default user umask is 027 or more restrictive"
    benchmark_ref: "CIS Ubuntu Linux 24.04 LTS Benchmark v1.0.0 - 5.4.4"
    mitre_attack: ["T1078"]
    compliance_frameworks:
      iso27001: "A.8.9 (Domyślne restrykcyjne uprawnienia nowych plików)"
      nis2: "Art. 21 ust. 2 lit. e (Ochrona poufności danych użytkowników)"
      ksc: "Zał. 1 pkt 9 (Zabezpieczenie domyślnej maski uprawnień umask 027)"
    risk_severity: "MEDIUM"
    cvss_base_score: 5.5
    description: >
      Zbyt otwarta maska tworzenia plików (np. umask 022 lub 002) pozwala innym lokalnym
      użytkownikom na odczyt nowo utworzonych plików i katalogów.
    collector:
      type: "linux_login_defs"
      parameter: "UMASK"
    expected_state:
      operator: "in_set"
      allowed_values: ["027", "077"]
    remediation: >
      W pliku /etc/login.defs oraz /etc/profile ustaw: UMASK 027.

