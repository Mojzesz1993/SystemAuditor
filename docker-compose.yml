# =============================================================================
# SystemAuditor Enterprise — Produkcyjny Stack Docker Compose
# =============================================================================
# Komponenty:
# 1. nginx-mtls-gateway : Terminacja TLS 1.3 + wymuszenie certyfikatu X.509 mTLS
# 2. auditor-api        : Serwer Centralny FastAPI + Uvicorn ASGI
# 3. rabbitmq           : Broker kolejkowy dla buforowania raportów z 10 000+ hostów
# 4. timescaledb        : Baza PostgreSQL 16 + TimescaleDB (Hypertables + JSONB)
# 5. redis              : Pamięć podręczna Heartbeat, Rate-Limiting i Anti-Replay Nonce
# =============================================================================

version: "3.9"

services:
  auditor-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: system-auditor-api
    ports:
      - "8000:8000"
    environment:
      - AUDITOR_HMAC_SECRET=super-secret-agent-signing-key
      - AUDITOR_ENROLLMENT_TOKEN=enr-token-2026-enterprise-bootstrap
      - POSTGRES_DSN=postgresql+asyncpg://auditor:auditor_pass@timescaledb:5432/system_auditor
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    volumes:
      - ./data:/app/data
    depends_on:
      - timescaledb
      - redis
      - rabbitmq
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: system-auditor-timescaledb
    environment:
      - POSTGRES_USER=auditor
      - POSTGRES_PASSWORD=auditor_pass
      - POSTGRES_DB=system_auditor
    volumes:
      - ./backend/schema_timescaledb.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: system-auditor-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: system-auditor-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

volumes:
  pgdata:
